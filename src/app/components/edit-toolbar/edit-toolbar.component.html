<div class="edit-toolbar" [hidden]="!isEditing">
  <p>
    {{ copy.instructions }}
    <span aria-live="polite">{{ saveStatus }}</span>
  </p>
  <button type="button" (click)="openPhotoPicker()">
    <i data-lucide="image-up" aria-hidden="true"></i>
    {{ copy.changePhoto }}
  </button>
  <details class="backup-menu">
    <summary>
      <i data-lucide="download" aria-hidden="true"></i>
      {{ copy.backup }}
    </summary>
    <div class="backup-menu-content">
      <label class="backup-menu-action">
        <i data-lucide="upload" aria-hidden="true"></i>
        {{ copy.importJson }}
        <input
          class="photo-input"
          type="file"
          accept="application/json,.json"
          (change)="importResume($event)"
        />
      </label>
      <button class="backup-menu-action" type="button" (click)="exportResume.emit()">
        <i data-lucide="download" aria-hidden="true"></i>
        {{ copy.exportJson }}
      </button>
    </div>
  </details>
  <button class="back-to-original" type="button" (click)="resetResume.emit()">
    <i data-lucide="rotate-ccw" aria-hidden="true"></i>
    {{ copy.restore }}
  </button>
  <button class="finish-editing" type="button" (click)="finishEditing.emit()">
    <i data-lucide="check" aria-hidden="true"></i>
    {{ copy.finish }}
  </button>
  <input
    #photoInput
    class="photo-input"
    type="file"
    accept="image/png,image/jpeg,image/webp"
    (change)="updatePhoto($event)"
  />
</div>
