<app-resume-actions
  [layout]="layout"
  [isEditing]="isEditing"
  [hasCustomizedResume]="hasCustomizedResume"
  [copy]="copy.actions"
  (layoutChange)="setLayout($event)"
  (downloadPdf)="printResume()"
  (customize)="openStartDialog()"
  (restoreOriginal)="restoreOriginal()"
/>

<app-edit-toolbar
  [isEditing]="isEditing"
  [saveStatus]="saveStatus"
  [copy]="copy.toolbar"
  (finishEditing)="finishEditing()"
  (resetResume)="resetResume()"
  (exportResume)="exportResume()"
  (resumeImported)="importResume($event)"
  (photoSelected)="updatePhoto($event)"
/>

<app-start-dialog
  #startDialog
  [copy]="copy.dialogs"
  (startExample)="startFromExample()"
  (startBlank)="startBlank()"
/>

<app-experience-dialog
  #experienceDialog
  [copy]="copy.dialogs"
  [placeholders]="copy.placeholders"
  (experienceCreated)="addExperience($event)"
/>

<div class="resume-shell" [class.resume-shell--toolbar-visible]="isEditing">
  <app-locale-switcher [locale]="currentLocale" (localeChange)="changeLocale($event)" />

  <main class="resume" [class.resume--toolbar-visible]="isEditing" [ngClass]="resumeClasses">
    <app-resume-sidebar
      [resume]="currentResume"
      [isEditing]="isEditing"
      [copy]="copy"
      (changed)="saveResume()"
      (changePhoto)="openPhotoPicker()"
    />

    <app-resume-content
      [resume]="currentResume"
      [isEditing]="isEditing"
      [copy]="copy"
      (changed)="saveResume()"
      (addExperienceRequested)="openExperienceDialog()"
    />

    <app-resume-highlights
      [highlights]="currentResume.highlights"
      [isEditing]="isEditing"
      [copy]="copy"
      (changed)="saveResume()"
    />
  </main>
</div>
